<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f7fb">
<meta name="description" content="Digital business card and contact details.">
<title>Your Name | Digital Business Card</title>
<style>
:root {
  color-scheme: light;
  --ink: #15243a;
  --muted: #65758b;
  --brand: #1769e0;
  --brand-dark: #1053b7;
  --line: #e5ebf2;
  --surface: #fff;
  --background: #f3f7fb;
}

* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 32px 16px;
  background:
    radial-gradient(ellipse at 15% 10%, #dbeafe 0, transparent 34%),
    radial-gradient(ellipse at 90% 90%, #d9f3ed 0, transparent 30%),
    var(--background);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.business-card {
  width: min(100%, 440px);
  overflow: hidden;
  border: 1px solid rgba(226, 234, 243, .9);
  border-radius: 24px;
  background: var(--surface);
  box-shadow: 0 24px 70px rgba(30, 58, 92, .14);
}

.cover {
  position: relative;
  height: 158px;
  overflow: hidden;
  background: linear-gradient(125deg, #124fbd 0%, #247fdb 58%, #27b89a 100%);
}

.cover::before,
.cover::after {
  position: absolute;
  content: "";
  border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 50%;
}

.cover::before {
  width: 250px;
  height: 250px;
  top: -155px;
  right: -20px;
}

.cover::after {
  width: 190px;
  height: 190px;
  bottom: -150px;
  left: -26px;
}

.card-content { padding: 0 30px 26px; }

.photo-placeholder {
  position: relative;
  display: grid;
  width: 112px;
  height: 112px;
  margin-top: -56px;
  place-items: center;
  border: 5px solid var(--surface);
  border-radius: 50%;
  background: #eaf1f8;
  color: #52677f;
  text-align: center;
  z-index: 1;
}

.photo-placeholder svg { width: 32px; height: 32px; }
.photo-placeholder span { display: block; margin-top: 3px; font-size: 11px; font-weight: 650; }
.photo-placeholder img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }

.identity { padding-top: 14px; }
.identity h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2rem); letter-spacing: -.04em; line-height: 1.2; }
.identity .role { margin: 7px 0 0; color: var(--muted); font-size: .98rem; }
.identity .company { margin: 3px 0 0; color: var(--brand); font-size: .95rem; font-weight: 700; }

.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 24px 0;
}

.action {
  display: flex;
  min-height: 76px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid #dbe7f5;
  border-radius: 14px;
  background: #f5f9ff;
  color: var(--brand-dark);
  font-size: .82rem;
  font-weight: 700;
  text-decoration: none;
  transition: background .15s ease, transform .15s ease;
}

.action:hover { transform: translateY(-2px); background: #eaf3ff; }
.action svg { width: 21px; height: 21px; }

.details {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
}

.detail {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.detail-icon {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border-radius: 12px;
  background: #f1f6fc;
  color: var(--brand);
}

.detail-icon svg { width: 19px; height: 19px; }
.detail-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: .75rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.detail-value { overflow-wrap: anywhere; color: var(--ink); font-size: .94rem; text-decoration: none; }
a.detail-value:hover { color: var(--brand); }

.edit-note {
  margin: 19px 0 0;
  color: var(--muted);
  font-size: .76rem;
  line-height: 1.5;
  text-align: center;
}

@media (max-width: 380px) {
  .card-content { padding-right: 20px; padding-left: 20px; }
  .actions { gap: 7px; }
}
</style>
</head>
<body>
<main class="business-card" aria-label="Digital business card">
  <div class="cover" aria-hidden="true"></div>
  <div class="card-content">
    <div class="photo-placeholder" role="img" aria-label="Profile photo placeholder">
      <div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 7.5h3l1.4-2h7.2l1.4 2h3A1.5 1.5 0 0 1 21.5 9v9a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
        <span>Add photo</span>
      </div>
    </div>

    <section class="identity" aria-labelledby="name">
      <h1 id="name">Your Name</h1>
      <p class="role">Your Job Title</p>
      <p class="company">Company Name</p>
    </section>

    <nav class="actions" aria-label="Contact actions">
      <a class="action" href="tel:+15550100000">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M7 3.5h3l1.5 4-2 1.7a15 15 0 0 0 5.3 5.3l1.7-2 4 1.5v3a2 2 0 0 1-2.2 2A16.7 16.7 0 0 1 5 6a2 2 0 0 1 2-2.5Z"/>
        </svg>
        Call
      </a>
      <a class="action" href="mailto:hello@example.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m4 7 8 6 8-6"/>
        </svg>
        Email
      </a>
      <a class="action" href="https://wa.me/15550100000" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M20 11.7a8 8 0 0 1-11.8 7L4 20l1.3-4A8 8 0 1 1 20 11.7Z"/>
          <path d="M9 8.5c.5 2 2.5 4 4.5 4.5l1-1 2 1c-.3 1.5-1.3 2-2.5 2-3.3-.3-6.8-3.8-7.1-7.1 0-1.2.5-2.2 2-2.5l1 2-1 1.1Z"/>
        </svg>
        WhatsApp
      </a>
    </nav>

    <ul class="details">
      <li class="detail">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg>
        </span>
        <div><span class="detail-label">Location</span><span class="detail-value">City, Country</span></div>
      </li>
      <li class="detail">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.3 2.5 3.4 5.5 3.4 9s-1.1 6.5-3.4 9c-2.3-2.5-3.4-5.5-3.4-9S9.7 5.5 12 3Z"/></svg>
        </span>
        <div><span class="detail-label">Website</span><a class="detail-value" href="https://example.com">www.example.com</a></div>
      </li>
    </ul>

    <p class="edit-note">Replace the sample name, photo, company, and contact details before publishing.</p>
  </div>
</main>
</body>
</html>
